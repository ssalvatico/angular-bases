
<h1>{{name}}</h1>
<dl>
    <td>Nombre</td>
    <dd>{{name}}</dd>

    <td>Edad</td>
    <dd>{{age}}</dd>

    <td>Método getHeroDescription</td>
    <dd>{{ getHeroDescription() }}</dd>

    <td>Capitalizado</td>
    <dd>{{ capitalizedName }}</dd>
</dl>

@if (name !== 'Spiderman') {
    <button
        class="btn btn-primary"
        (click)="changeHero()"
        >
        Cambiar nombre
    </button>
}

@if (age !== 20) {
    <button
        class="btn btn-primary mx-2"
        (click)="changeAge()"
        >
        Cambiar edad
    </button>
}
@if (name === 'Spiderman' || age === 20) {
    <button
        class="btn btn-primary mx-2"
        (click)="resetValues()"
        >
        Reset values
    </button>
}

<hr>
