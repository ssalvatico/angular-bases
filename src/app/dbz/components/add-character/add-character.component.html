<h4>Agregar personaje</h4>
<form class="row" (ngSubmit)="addCharacter()">
    
    <input
        type="text"
        class="form-control mb-2"
        placeholder="Nombre"
        [(ngModel)]="character.name"
        name = "name"
    >

    <input
        type="number"
        class="form-control mb-2"
        placeholder="ki"
        [(ngModel)]="character.ki"
        name = "ki"
    >
    
    <button type="submit" class="btn btn-success my-2">Agregar</button>

    <!-- <pre>{{character | json}}</pre> -->
</form>
