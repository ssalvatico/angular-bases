<h4>Listado (nombre/ki)</h4>
<ul class="list-group">
    
    @for ( character of characterList; track $index; ) {
        <li 
            class="list-group-item d-flex justify-content-between align-items-center"
            [ngClass]="{
                'list-group-item-primary'   : $first,
                'list-group-item-info'      : $last,
                'list-group-item-light'     : (!$first && !$last && $even),
                'list-group-item-secondary' : (!$first && !$last && !$even)
            }"
        >
            <div>
                    <small class="text-primary">{{$index + 1}}. </small>
                    <span>Nombre: {{character.name}} - </span>
                    <strong>Ki: {{character.ki}}</strong>
            </div>   
        
            <button id="delete"
                (click)="onDeleteCharacter(character.id!)"
            >x</button>
        </li>
    }

</ul>
