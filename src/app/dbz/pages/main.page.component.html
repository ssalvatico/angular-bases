<h1>Dbz personajes</h1>

<div class="row">

    <div class="col">
        <app-dbz-character-list [characterList]="characters" (onDeleteID)="deleteCharacterById($event)"></app-dbz-character-list>
    </div>
    <div class="col">
        <app-dbz-add-character (onNewCharacter)="addCharacter($event)" ></app-dbz-add-character>
    </div>

</div>
